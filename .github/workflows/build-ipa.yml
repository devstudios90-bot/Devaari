name: Build Devaari iPad Browser IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Devaari/Devaari.xcodeproj \
            -scheme Devaari \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Devaari.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Devaari.xcarchive/Products/Applications/Devaari.app Payload/
          zip -r Devaari.ipa Payload
          ls -la Devaari.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Devaari-IPA
          path: Devaari.ipa
