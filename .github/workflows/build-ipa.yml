name: Build Devaari iPad Browser IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Devaari/Devaari.xcodeproj \
            -scheme Devaari \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Devaari.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Devaari.xcarchive/Products/Applications/Devaari.app Payload/
          zip -r Devaari.ipa Payload
          ls -la Devaari.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Devaari-IPA
          path: Devaari.ipa

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: Devaari.ipa
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Devaari Browser v1.0.0 (Build ${{ github.run_number }})"
          body: "Official build of Devaari Browser for iPad with integrated TryAIToday Flow Automator."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
